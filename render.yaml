services:
  - type: web
    name: testgen-ai-api
    runtime: docker
    plan: free
    dockerCommand: sh scripts/start_render_web.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: testgen-ai-db
          property: connectionString
      - key: TESTGEN_MODE
        value: durable
      - key: TESTGEN_REQUIRE_WORKSPACE
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: TESTGEN_WORKSPACE_SECRET
        generateValue: true

databases:
  - name: testgen-ai-db
    plan: free
