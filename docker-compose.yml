services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testgen
      POSTGRES_USER: testgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testgen-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://testgen:${POSTGRES_PASSWORD:-testgen-local}@db:5432/testgen
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    volumes:
      - run-data:/app/output
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: python -m runs.worker
    environment: *backend-env
    volumes:
      - run-data:/app/output
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true

  ui:
    build: .
    environment:
      TESTGEN_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  postgres-data:
  run-data:
